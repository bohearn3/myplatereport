name = "myplatereport"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Static pages (home page, report viewer, admin upload page) live in ./public
[assets]
directory = "./public"
binding = "ASSETS"

# Umpire replies to report emails go here. RESEND_API_KEY is a secret set in the Cloudflare dashboard.
[vars]
REPLY_TO = "bohearn3@gmail.com"

# Weekly staff email: Wednesdays at 17:00 UTC (10 am Pacific in summer, 9 am in winter; 7 am Hawaii).
# The all-conference version goes to REPLY_TO; each coordinator gets their own conferences.
[triggers]
crons = ["0 17 * * 3"]

# Umpires, games, pitches and report links (tables are created automatically on first use)
[[d1_databases]]
binding = "DB"
database_name = "myplatereport"
database_id = "5d4593ff-176d-4e3d-8fa7-343711e266d8"

# Cloudflare Browser Run: turns each report into a PDF (no API key needed)
[browser]
binding = "BROWSER"

# PDF storage (Workers KV namespace: myplatereport-pdfs)
[[kv_namespaces]]
binding = "PDFS"
id = "91108414826c4cd8b4817d541f429f62"
