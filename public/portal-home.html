<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My Reports · MyPlateReport</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/admin.css">
<style>
/* Layout: one column; trends (tiles + charts) above the list of games, each with its report. */
html,body{height:auto;min-height:100%}
main{width:100%;max-width:1040px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,5vw,2.6rem);text-transform:uppercase;margin:2px 0 4px;line-height:1}
.sub{color:var(--muted);margin:0 0 20px}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0;background:var(--surface)}
.tile .k{font-size:.74rem;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:1.8rem;line-height:1.05}
.tile .d{font-size:.76rem;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--warn)}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chart{border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px;background:var(--surface);min-width:0}
.chart .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.84rem;font-weight:700}
.chart .ct span{font-weight:500;color:var(--muted);font-size:.74rem}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font-family:var(--f-body);fill:var(--muted);font-size:10px}
.chart svg a circle{cursor:pointer}
.legend2{display:flex;gap:12px;font-size:.74rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;justify-content:space-between;gap:12px;align-items:center;min-width:0}
.game .t{min-width:0}
.game b{display:block;overflow-wrap:anywhere}
.game .m{color:var(--muted);font-size:.84rem}
.game .acc{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;text-align:right;white-space:nowrap}
.game .acc small{display:block;font-family:var(--f-body);font-weight:600;font-size:.7rem;color:var(--muted)}
.game .links{display:flex;gap:14px;margin-top:6px}
.game .links a,.game .links button{color:var(--deep);font:inherit;font-weight:600;font-size:.86rem;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.7rem;font-weight:700;background:color-mix(in srgb,var(--powder) 20%,transparent);color:var(--deep);margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:12px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.charts,.games{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="band">
  <a href="/"><img class="logo" src="/img/myplatereport-logo-dark.png" alt="MyPlateReport" width="1200" height="398"></a>
  <div class="nav-wrap"><span class="who"><span id="who"></span><button type="button" id="signout">Sign out</button></span></div>
</header>
<main>
  <div class="eyebrow">Umpire portal</div>
  <h1 id="hello">My reports</h1>
  <p class="sub" id="sub">Loading your games…</p>
  <div id="m"></div>
  <section id="trends" hidden>
    <h2>My trends</h2>
    <div class="tiles" id="tiles"></div>
    <div class="charts" id="charts" style="margin-top:10px"></div>
    <div class="legend2"><span><i style="background:var(--deep)"></i>Regular season</span><span><i style="border:2px solid var(--deep);box-sizing:border-box"></i>Scrimmage / intrasquad</span><span>Dashed line: your average · tap a dot to open that report</span></div>
  </section>
  <section>
    <h2>My games</h2>
    <div class="games" id="games"></div>
  </section>
</main>
<script src="/assets/trends.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = MPRTrends;
const post = (u, b) => fetch(u, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(b||{})}).then(async r => ({ok:r.ok, status:r.status, j: await r.json().catch(()=>({}))}));

async function load(){
  const r = await fetch('/portal/api/me', {headers:{accept:'application/json'}});
  if (r.status === 401) { location.replace('/portal/login?next=' + encodeURIComponent(location.pathname)); return; }
  if (!r.ok) { $('sub').textContent = 'Your reports could not be loaded. Refresh to try again.'; return; }
  const d = await r.json();
  const first = d.umpire.name.split(' ')[0];
  $('hello').textContent = `${first}'s reports`;
  $('who').innerHTML = `<b>${esc(d.umpire.name)}</b>`;
  document.title = `${d.umpire.name} · MyPlateReport`;
  const n = d.games.length;
  $('sub').textContent = n ? `${n} game${n===1?'':'s'} behind the plate, scored on the 2027 NCAA static zone. Your trends use only your own games.` : 'No games yet. Your reports will show up here after your next plate game.';
  const t = T.render(d.games, d.reports, {you:true});
  if (t) { $('trends').hidden = false; $('tiles').innerHTML = t.tiles; $('charts').innerHTML = t.charts; }
  $('games').innerHTML = d.games.map(g => {
    const rep = d.reports[g.id];
    return `<div class="game"><div class="t"><b>${esc(T.title(g))}${T.isScrim(g)?'<span class="tag">Scrimmage</span>':''}</b>
      <span class="m">${T.fmtDate(g.date)}${g.misses!=null?` · ${g.misses} missed`:''}${g.decisions?` · ${g.decisions} calls`:''}</span>
      <div class="links">${rep ? `<a href="/r/${esc(rep)}" target="_blank" rel="noopener">Open report</a><a href="/r/${esc(rep)}/pdf" target="_blank" rel="noopener">PDF</a>` : `<button type="button" data-open="${esc(g.id)}">Open report</button>`}</div></div>
      <div class="acc">${T.pct(g.adj)}<small>adjusted</small></div></div>`;
  }).join('') || '<div class="empty">No games yet.</div>';
}
$('games').addEventListener('click', async e => {
  const b = e.target.closest('[data-open]'); if (!b) return;
  const w = window.open('', '_blank'); b.disabled = true;
  const r = await post('/portal/api/games/' + b.dataset.open + '/open');
  b.disabled = false;
  if (!r.ok) { if (w) w.close(); $('m').innerHTML = `<div class="msg err">${esc(r.j.error || 'That report could not be opened.')}</div>`; return; }
  const url = '/r/' + encodeURIComponent(r.j.reportId);
  if (w) w.location = url; else location.href = url;
  load();
});
$('signout').addEventListener('click', async () => { try { await post('/portal/api/logout'); } catch(e){} location.href = '/portal/login'; });
load();
})();
</script>
</body>
</html>
