<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Coordinator Sign In · MyPlateReport</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/admin.css">
<style>
/* Layout: a single centered sign-in card under the black brand band. */
html,body{height:auto;min-height:100%}
main{flex:1;display:grid;place-items:start center;padding:56px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;text-transform:uppercase;margin:0 0 4px;line-height:1}
.sub{color:var(--muted);margin:0 0 16px}
input.code{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:.3em;text-align:center;padding:10px}
.link{background:none;border:0;color:var(--deep);font:inherit;font-weight:600;padding:0;cursor:pointer;margin-top:14px}
.foot{color:var(--muted);font-size:.8rem;margin-top:18px;text-align:center}
</style>
</head>
<body>
<header class="band"><a href="/"><img class="logo" src="/img/bb-collegiate-umpires-dark.png" alt="BB Collegiate Umpires" width="1200" height="201"></a></header>
<main>
  <div class="card">
    <form id="f1" novalidate>
      <div class="eyebrow">Conference coordinators</div>
      <h1>Sign in</h1>
      <p class="sub">Enter your email and we'll send you a 6-digit code. There's no password.</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
      <button class="primary" type="submit" id="b1" style="margin-top:14px">Email me a code</button>
      <div id="m1"></div>
    </form>
    <form id="f2" novalidate hidden>
      <div class="eyebrow">Check your email</div>
      <h1>Enter code</h1>
      <p class="sub" id="sent-to"></p>
      <label for="code">6-digit code</label>
      <input type="text" id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <button class="primary" type="submit" id="b2" style="margin-top:14px">Sign in</button>
      <div id="m2"></div>
      <button type="button" class="link" id="again">Use a different email or send a new code</button>
    </form>
    <p class="foot">Site admin? Use <a href="/admin/">the admin sign-in</a>.</p>
  </div>
</main>
<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs = new URLSearchParams(location.search);
const next = (qs.get('next') || '/coord/').startsWith('/coord') ? (qs.get('next') || '/coord/') : '/coord/';
if (qs.get('email')) $('email').value = qs.get('email');
const post = (u, b) => fetch(u, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(b)}).then(async r => ({ok: r.ok, j: await r.json().catch(()=>({}))}));
// Already signed in? Go straight in.
fetch('/coord/api/me').then(r => { if (r.ok) location.replace(next); });

$('f1').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $('m1').innerHTML = '<div class="msg err">Enter a valid email address.</div>'; return; }
  $('b1').disabled = true; $('m1').innerHTML = '';
  const r = await post('/coord/api/login/start', {email});
  $('b1').disabled = false;
  if (!r.ok) { $('m1').innerHTML = `<div class="msg err">${esc(r.j.error || 'Something went wrong. Try again.')}</div>`; return; }
  $('sent-to').textContent = `If ${email} has coordinator access, a code is on its way. It works for 10 minutes.`;
  $('f1').hidden = true; $('f2').hidden = false; $('code').value = ''; $('code').focus();
});
$('code').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,6); if (e.target.value.length === 6) $('f2').requestSubmit(); });
$('f2').addEventListener('submit', async e => {
  e.preventDefault();
  if ($('code').value.length !== 6) { $('m2').innerHTML = '<div class="msg err">Enter all 6 digits.</div>'; return; }
  $('b2').disabled = true; $('m2').innerHTML = '';
  const r = await post('/coord/api/login/verify', {email: $('email').value.trim(), code: $('code').value});
  $('b2').disabled = false;
  if (!r.ok) { $('m2').innerHTML = `<div class="msg err">${esc(r.j.error || 'That code did not work.')}</div>`; $('code').select(); return; }
  location.replace(next);
});
$('again').addEventListener('click', () => { $('f2').hidden = true; $('f1').hidden = false; $('m1').innerHTML = ''; $('email').focus(); });
})();
</script>
</body>
</html>
